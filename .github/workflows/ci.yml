name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose.yaml reads secrets from .env (env_file + ${...} interpolation),
      # so validate against the committed template.
      - name: Create .env from the template
        run: cp stack/.env.example stack/.env

      - name: Validate compose file (all profiles)
        run: docker compose -f stack/compose.yaml --profile linux --profile debug config -q

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Lint YAML
        run: yamllint --strict .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.6"

      - uses: terraform-linters/setup-tflint@v4

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: tflint
        run: |
          tflint --init
          tflint --recursive
